<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=initial-width, initial-scale=1.0" />
		<title>cenywalut.online</title>

		<meta name="description" content="Po ile Euro? Po ile Dolary? Sprawdź ceny walut na cenywalut.online" />
		<meta name="keywords" content="kursy nbp, ceny walut, kursy walut, cena euro, cena dolary, eur do pln, pln do eur, eur do usd, usd do eur" />
		<style>
			body {text-align: center;}
		</style>
	</head>
	<body>
		<header>
			<h1>Ceny walut</h1>
			<h2>Sprawdź po ile kupisz i sprzedasz najpopularniejsze waluty</h2>
		</header>
		<main>
			<section>
				<h2>Przelicznik waluty</h2>
				<p>Źródło danych: <a href="https://nbp.pl">NBP</a>. <span id="aktualizacja"></span></p>
				<form id="currency-form">
					<select id="waluta" name="waluta">
						<option value="EUR">Euro</option>
						<option value="USD">Dolar amerykański</option>
					</select>
					<label for="kwota">Kwota</label>
					<input id="kwota" type="number" name="kwota" value=100>
					<button type="submit">Przelicz</button>
				</form>
			</section>
			<section id="form-output" style="display: none;">
				<h2>Wynik kalkulacji: </h2>
				<p id='kurs-ask'></p>
				<p id='kurs-bid'></p>

				<p><span id='zakup'></span> kupisz za <span id="zakup-wynik"></span></p>
				<p><span id='zakup-2'></span> kupisz za <span id="zakup-wynik-2"></span></p>

				<p><span id='sprzedaz'></span> sprzedasz za <span id="sprzedaz-wynik"></span></p>
				<p><span id='sprzedaz-2'></span> sprzedasz za <span id="sprzedaz-wynik-2"></span></p>
			</section>
		</main>
		<footer>
			<address>
				<p>Strona autora:</p>
				<a href="https://mysliwczykrafal.pl">mysliwczykrafal.pl</a>
			</address>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
